[package]
name = "maccontrol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
core-foundation = "0.10.1"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
winit = "0.30"
